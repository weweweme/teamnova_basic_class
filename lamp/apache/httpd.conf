# === 업로드 폴더 보안: 올라온 파일은 절대 실행하지 않는다 ===
#   프로필 이미지 업로드 방어의 마지막 층.
#   PHP 코드 쪽 방어(①내용으로 진짜 이미지인지 검사 ②파일명 강제 재생성)가 뚫려서
#   이미지로 위장한 .php가 올라오더라도, 여기서 실행이 막혀 무해한 파일로 남는다.
#     php_admin_flag engine off = 이 폴더에선 PHP 엔진 자체를 끈다.
#       (admin이 붙으면 .htaccess로도 되돌릴 수 없다 — 서버 설정이 최종 결정)
#     Require all denied  = 스크립트 확장자는 아예 내려받지도 못하게 한다.
<Directory "${APP_DIR}/uploads">
    #   위쪽에서 .php 에 걸어둔 PHP 핸들러를 이 폴더에선 해제한다.
    #   확장자 목록에 없는 것까지 덮어주므로, 아래 목록의 빈틈을 메우는 역할.
    SetHandler none
    php_admin_flag engine off
    <FilesMatch "\.(php|phtml|phar|cgi|pl)$">
        Require all denied
    </FilesMatch>
</Directory>


# ============================================================
# http(80)로 들어오면 https로 보낸다
#   [왜]
#     둘 다 열어두면 사람들이 그냥 http로 계속 쓴다. 그러면 세션 번호표와
#     자동 로그인 토큰이 **평문으로 흐른다** — HTTPS를 붙인 의미가 없어진다.
#     문을 하나만 남기는 것이 아니라, **어느 문으로 들어와도 같은 곳에 도착**하게 하는 것이다.
#
#   ★ ${HTTPS_HOST} = docker-compose.yml 의 environment 에서 넘어온다 (예: localhost:8443).
#     컨테이너 안 Apache는 자기가 443에서 듣는 것만 알지, 밖에서 8443으로 이어져
#     있다는 건 모르기 때문에 알려줘야 한다. (실서비스는 443이 기본이라 이 줄이 필요 없다)
#
#   ★ 301이 아니라 302를 쓴다 — 301은 브라우저가 **영구 캐시**해서,
#     나중에 http로 되돌리고 싶어도 브라우저가 계속 https로 보낸다. 개발 중에는 302가 안전하다.
#     (실서비스에서는 301 + HSTS 헤더가 정석이다)
# ============================================================
<IfModule rewrite_module>
    RewriteEngine On
    RewriteCond %{HTTPS} !=on
    RewriteRule ^/?(.*) https://${HTTPS_HOST}/$1 [R=302,L]
</IfModule>

# ============================================================
# HTTPS (443)
#   [왜 붙였나]
#     세션 번호표(PHPSESSID)와 자동 로그인 토큰(remember)이 **쿠키로 오간다.**
#     http면 그 값이 **평문으로 네트워크를 흐른다** — 같은 와이파이에서 그대로 보인다.
#     쿠키를 아무리 잘 설계해도(httponly·samesite·회전·재사용 탐지)
#     **채널이 평문이면 도청 한 번으로 전부 무의미해진다.**
#
#   ★ https로 접속하면 PHP의 $_SERVER['HTTPS']가 켜지고,
#     우리 코드의 'secure' => !empty($_SERVER['HTTPS']) 가 **저절로 참**이 된다.
#     → 모든 쿠키에 Secure 플래그가 붙는다. PHP 코드는 한 줄도 안 고쳤다.
#
#   ※ 인증서는 entrypoint.sh가 없으면 만들어 준다(자체 서명).
#     브라우저가 "안전하지 않음" 경고를 띄우는데, 이는 **암호화가 안 된다는 뜻이 아니라
#     '이 인증서를 누가 보증하는지 모르겠다'는 뜻**이다. 암호화 자체는 정상 동작한다.
# ============================================================
Listen 443

<IfModule ssl_module>
    SSLRandomSeed startup builtin
    SSLRandomSeed connect builtin

    # 낡고 깨진 프로토콜은 끈다 (TLS 1.2 이상만).
    SSLProtocol -all +TLSv1.2 +TLSv1.3
    SSLHonorCipherOrder off
    SSLSessionCache "shmcb:/usr/local/apache2/logs/ssl_scache(512000)"

    <VirtualHost *:443>
        DocumentRoot "${APP_DIR}"
        ServerName localhost

        SSLEngine on
        SSLCertificateFile      "/usr/local/apache2/conf/server.crt"
        SSLCertificateKeyFile   "/usr/local/apache2/conf/server.key"

        <Directory "${APP_DIR}">
            Options Indexes FollowSymLinks
            AllowOverride None
            Require all granted
            DirectoryIndex index.php index.html
        </Directory>

        # 업로드 폴더 방어는 http와 똑같이 적용한다.
        #   ★ VirtualHost 안은 별도 세상이라 위쪽 설정이 자동으로 안 따라온다.
        #     한쪽에만 걸면 https로 들어온 요청은 방어를 통과해 버린다.
        <Directory "${APP_DIR}/uploads">
            SetHandler none
            php_admin_flag engine off
            <FilesMatch "\.(php|phtml|phar|cgi|pl)$">
                Require all denied
            </FilesMatch>
        </Directory>
    </VirtualHost>
</IfModule>
