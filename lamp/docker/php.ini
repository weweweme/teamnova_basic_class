; ============================================================
; php.ini — 컨테이너 PHP 설정
;
;   [왜 필요한가]
;     이 컨테이너에는 php.ini 가 아예 없어서 PHP 기본값으로 돌고 있었다.
;     기본값에서는 OPcache 가 **매 요청마다 캐시된 파일 전부의 수정 시각을 확인**한다.
;     소스가 Windows 바인드 마운트(./src) 위에 있어서 파일 하나 확인에 약 1.1ms 가 든다.
;     Laravel 은 요청당 1,000개 넘는 파일을 쓰므로 그것만으로 1초 이상이 사라진다.
;     (실측: 모든 화면이 4~5초 → 이 설정 적용 후 확인)
;
;   ※ 이 파일은 Git으로 관리되고 entrypoint.sh 가 컨테이너에 복사한다.
;     컨테이너를 지우고 다시 만들어도 따라온다.
; ============================================================

[opcache]
opcache.enable = 1

; ★ 확인 자체를 끄지는 않는다(=0). 개발 중에는 고친 코드가 바로 보여야 한다.
;   대신 '얼마나 자주 확인할지'를 늘린다 — 한 파일당 최대 60초에 한 번만 확인한다.
opcache.validate_timestamps = 1
opcache.revalidate_freq = 60

; Symfony 성능 문서가 권하는 값. Laravel 도 클래스 이름이 길어 사정이 같다.
opcache.memory_consumption = 256
opcache.max_accelerated_files = 32531
opcache.interned_strings_buffer = 32

[PHP]
; 파일 경로를 푸는 결과도 캐시한다. 느린 파일시스템에서 특히 효과가 크다.
realpath_cache_size = 4096K
realpath_cache_ttl = 600

; 아바타 업로드 한도(2MB)보다 여유를 둔다
upload_max_filesize = 4M
post_max_size = 8M
